<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pronuncia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
:root{--paper:#f5f7fb;--card:#fff;--ink:#152033;--muted:#566377;--rule:#e0e6ef;--accent:#1e78ff;--accent-ink:#0b5bd3;--accent-soft:#e4efff;--on-accent:#06101f;--ok:#17795f;--ok-soft:#dff4ed;--bad:#c22437;--bad-soft:#ffe3e8;--near:#8f5e00;--near-soft:#fff3cc;--verde:#42b192;--verde-soft:#dff4ed;--verde-edge:#2b8a70;--on-verde:#04231a;--rosso:#e5324d;--rosso-soft:#ffe3e8;--rosso-edge:#b31e36;--on-rosso:#14060a;--sole:#ffb300;--sole-soft:#fff3cc;--mare:#1e78ff;--viola:#7c4dff;--viola-soft:#eee8ff;--track:rgba(21,32,51,.13);--shadow:rgba(20,30,50,.13);--font-ui:"Golos Text","Segoe UI",system-ui,sans-serif;--font-serif:"Literata",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--paper:#0e1420;--card:#182130;--ink:#eef2f9;--muted:#a8b3c6;--rule:#2b3648;--accent:#6ea8ff;--accent-ink:#6ea8ff;--accent-soft:#17294a;--on-accent:#08111f;--ok:#6fd4b6;--ok-soft:#17443a;--bad:#ff8a8f;--bad-soft:#40202a;--near:#f2bb55;--near-soft:#40351a;--verde:#42b192;--verde-soft:#17443a;--verde-edge:#2b8a70;--on-verde:#04231a;--rosso:#ff6b7f;--rosso-soft:#40202a;--rosso-edge:#d14358;--on-rosso:#14060a;--sole:#ffc83d;--sole-soft:#40351a;--mare:#6ea8ff;--viola:#b49cff;--viola-soft:#2c2450;--track:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-ui)}
body::before{content:"";display:block;height:5px;background:linear-gradient(90deg,#009246 0 33.33%,#fff 33.33% 66.66%,#ce2b37 66.66%);box-shadow:0 1px 0 var(--rule)}
a{color:var(--accent-ink)}
[hidden]{display:none !important}
p{margin:6px 0}
.wrap{max-width:760px;margin:0 auto;padding:10px 14px 36px}
.head{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:12px;min-height:44px;padding:6px 8px;max-width:100%}
select{contain:paint}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 1rem/1.25 var(--font-ui);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px;min-height:44px;padding:9px 16px;box-shadow:0 3px 0 var(--rule);cursor:pointer;max-width:100%;text-decoration:none;text-align:center}
.btn:active:not([disabled]),.mic:active:not([disabled]),.say:active:not([disabled]),.keys button:active,.sayp:active{transform:translateY(2px)}
.btn:active:not([disabled]){box-shadow:0 1px 0 var(--rule)}
.btn.primary{background:var(--verde);color:var(--on-verde);border-color:transparent;box-shadow:0 3px 0 var(--verde-edge)}
.btn.primary:active:not([disabled]){box-shadow:0 1px 0 var(--verde-edge)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent-ink);padding:8px 2px;font-weight:500}
.btn.quiet{background:transparent;box-shadow:none;color:var(--muted);font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.where{background:var(--work-soft);border-radius:16px;padding:10px 14px 12px;margin:0 0 12px}
.where h1{font:700 1.15rem/1.2 var(--font-serif);margin:0}
.place{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.place b,.set-title{font:600 1.05rem/1.3 var(--font-ui);margin:4px 0 0;overflow-wrap:anywhere}
.bar{position:relative;height:14px;border-radius:99px;background:var(--track);margin:8px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
#barPos{background:var(--work);opacity:.3}
#barOk{background:linear-gradient(90deg,var(--verde),var(--sole))}
#barNeed{width:3px;top:-3px;bottom:-3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.progress{display:flex;flex-wrap:wrap;gap:0 14px;font-size:.95rem;color:var(--ink)}
.progress #need{font-weight:600}
.card{background:var(--card);border-radius:16px;padding:18px 16px;margin:0 0 14px;box-shadow:0 6px 20px var(--shadow)}
.notice{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--near-soft)}
.notice.bad{background:var(--bad-soft)}
.notice code{font-size:.95em;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:16px 0 8px}
.mic{display:flex;align-items:center;justify-content:center;gap:12px;flex:1 1 100%;width:100%;max-width:460px;min-height:76px;margin:0 max(0px,calc(50% - 230px));padding:14px 20px;font:700 1.35rem/1.2 var(--font-ui);border:0;border-radius:14px;background:var(--verde);color:var(--on-verde);box-shadow:0 3px 0 var(--verde-edge);cursor:pointer}
.mic svg{width:32px;height:32px}
.mic:active:not([disabled]){box-shadow:0 1px 0 var(--verde-edge)}
.mic.listening{background:var(--rosso);color:var(--on-rosso);box-shadow:0 3px 0 var(--rosso-edge);animation:pulse 1.1s infinite}
.mic[disabled]{opacity:.5;cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--rosso-edge),0 0 0 0 rgba(229,50,77,.55)}50%{box-shadow:0 3px 0 var(--rosso-edge),0 0 0 16px rgba(229,50,77,0)}}
.say{display:inline-flex;align-items:center;gap:8px;font:500 .95rem var(--font-ui);min-height:44px;padding:8px 14px;border-radius:14px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.say svg{width:18px;height:18px}
.say[disabled]{opacity:.55;cursor:default}
.interim{color:var(--muted);font-style:italic;margin-top:6px;text-align:center}
.interim:empty{margin:0}
.trace{font:.72rem/1.35 ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.result{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.result.ok{background:var(--ok-soft)}
.result.bad{background:var(--bad-soft)}
.result.near{background:var(--near-soft)}
.result a{font-weight:600}
.alts{color:var(--muted);font-size:.95rem;display:block;margin-top:4px;overflow-wrap:anywhere}
.praise{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px}
.praise b{font:700 1.5rem/1.25 var(--font-serif);color:var(--ok)}
.sayp{font:inherit;font-size:1.2rem;min-width:44px;min-height:44px;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.card:has(.result.ok:not([hidden])) #next{background:var(--verde);color:var(--on-verde);border-color:transparent;box-shadow:0 3px 0 var(--verde-edge)}
.card:has(.result.ok:not([hidden])) .mic:not(.listening),.card:has(.result.ok:not([hidden])) #check{background:var(--card);color:var(--ink);border:1px solid var(--rule);box-shadow:0 3px 0 var(--rule);min-height:52px;font-size:1.05rem}
.finish{text-align:center}
.finish h2{font:700 1.3rem/1.25 var(--font-serif);margin:6px 0 6px}
.finish .praise{justify-content:center}
.finish .praise b{flex:1 1 100%;font-size:2.1rem}
.finish.low .praise b{color:var(--near)}
.finish .praise span{font-size:1.15rem}
.finish .nav{justify-content:center;flex-direction:column;align-items:center}
.finish .nav .btn{width:100%;max-width:400px}
.finish .nav .btn.primary{min-height:60px;font-size:1.15rem}
.stars{font-size:2.6rem;line-height:1.1;letter-spacing:.06em}
#locked{text-align:center}
#locked h2{font:700 1.3rem/1.25 var(--font-serif);margin:0 0 6px}
#locked h2::before{content:"🔒 "}
#locked .nav{justify-content:center}
.sets{margin-top:20px}
.sets h2{font:700 1.15rem/1.3 var(--font-ui);margin:0 0 10px}
.setlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.setcard{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:9px 12px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.setcard .ic{font-size:1.4rem;line-height:1;flex:none}
.setcard .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.setlist .unit{grid-column:1/-1;font:600 .95rem/1.3 var(--font-ui);color:var(--muted);margin:8px 0 0}
.setlist .unit:first-child{margin-top:0}
.setcard b{display:block;font-weight:600;line-height:1.3}
.setcard .st{display:block;font-size:.9rem;color:var(--muted)}
.setcard.done{background:var(--verde-soft)}
.setcard.done .st{color:var(--ok);font-weight:600}
.setcard.next{background:var(--work-soft);border-color:var(--work);box-shadow:0 3px 0 var(--work)}
.setcard.next .st{color:var(--ink);font-weight:700}
.setcard.lock{min-height:48px;padding:6px 12px;background:transparent;border:2px dashed var(--rule);box-shadow:none;cursor:default}
.setcard.lock .ic{font-size:1.1rem}
.setcard.lock .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px}
.setcard.lock b{font-weight:500;color:var(--muted)}
.setcard[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.more{margin-top:10px;color:var(--muted)}
.more summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}
.more summary::before{content:"▸";margin-right:8px}
.more[open] summary::before{content:"▾"}
.more[open]{color:var(--ink)}
footer{margin-top:18px}
.ver{font-size:.75rem;color:var(--muted);text-align:center;margin:10px 0 20px}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg)}}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.setcard:focus-visible{outline:3px solid var(--mare);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.btn:active,.mic:active,.say:active,.keys button:active,.sayp:active{transform:none !important}.confetti{display:none}}
body{--work:var(--rosso);--work-soft:var(--rosso-soft)}
.where h1::before{content:"🎤 "}
body.locked .sets{display:none}
.milestone{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--sole-soft)}
.milestone .cup{font-size:1.8rem;line-height:1}
.milestone #milestonePraise{flex:1;min-width:0}
.milestone .praise b{font-size:1.2rem}
.milestone .praise{gap:0 8px}
.milestone .sayp{min-height:32px}
.milestone .btn{flex:1 1 100%}
.sub{text-align:center;margin:0 0 4px}
.own{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.own .btn{flex:1 1 120px}
.own input{flex:1 1 220px;min-width:0;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:14px;min-height:44px;padding:8px 12px}
.word{font:700 clamp(2.1rem,8vw,3.2rem)/1.15 var(--font-serif);margin:10px 0 4px;text-align:center;overflow-wrap:anywhere}
.tr{min-height:1.5em;text-align:center;font-size:1.15rem}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;flex:none}
.list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{font:inherit;min-height:36px;padding:4px 10px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;overflow-wrap:anywhere;max-width:100%}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip[aria-current="true"]{outline:2px solid var(--work)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <a class="btn ghost back" data-t="back" href="https://claude.ai/artifact/2dHceWUgiBVyDRLb81RwQ5"></a>
    <select id="langSel"></select>
  </header>
  <section class="where">
    <h1>Pronuncia</h1>
    <h2 class="set-title" id="setTitle"></h2>
    <div id="whereProg">
      <div class="bar" aria-hidden="true"><i id="barPos"></i><i id="barOk"></i><i id="barNeed"></i></div>
      <div class="progress"><span><span id="posLabel"></span> <span id="pos"></span></span><span id="learned"></span><span id="need"></span></div>
    </div>
    <div class="milestone" id="milestone" hidden><span class="cup" aria-hidden="true">🏆</span><div id="milestonePraise"></div><a class="btn primary" id="milestoneGo"></a></div>
  </section>
  <div class="notice" id="notice" hidden role="status"></div>
  <section class="card" id="locked" hidden><h2 id="lockedTitle"></h2><p id="lockedText"></p><div class="nav"><a class="btn primary" id="lockedGo"></a></div></section>
  <section class="card" id="work" aria-live="polite">
    <p class="sub" data-t="sub"></p>
    <div class="own" id="own" hidden><input type="text" id="ownText" lang="it" autocomplete="off" spellcheck="false"><button type="button" class="btn primary" id="ownGo" data-t="ownGo"></button></div>
    <div class="word" id="word" lang="it"></div>
    <div class="tr" id="tr"></div>
    <div class="actions">
      <button type="button" class="mic" id="mic"><span id="micIcon"></span><span id="micLabel" data-t="mic"></span></button>
      <button type="button" class="say" id="play"><span id="spk"></span><span data-t="play"></span></button>
    </div>
    <div class="interim" id="interim"></div>
    <div class="result" id="result" hidden></div>
    <div class="nav"><button type="button" class="btn quiet" id="prev" data-t="prev"></button><button type="button" class="btn" id="again" hidden data-t="again"></button><button type="button" class="btn" id="next" data-t="next"></button></div>
  </section>
  <section class="card finish" id="finish" hidden>
    <div class="stars" id="finishStars" role="img" hidden></div>
    <div id="finishPraise"></div>
    <h2 id="finishTitle"></h2>
    <p id="finishScore"></p>
    <div class="nav"><a class="btn primary" id="finishNext"></a><button type="button" class="btn" id="restart" data-t="restart"></button></div>
  </section>
  <details class="more" id="wordsBox"><summary data-t="wordsList"></summary><div class="list" id="list"></div></details>
  <details class="more controls"><summary data-t="settings"></summary>
    <label class="chk"><input type="checkbox" id="shuffle"> <span data-t="shuffle"></span></label>
    <label class="chk"><input type="checkbox" id="onlyNew"> <span data-t="onlyNew"></span></label>
    <label class="chk"><input type="checkbox" id="autoPlay"> <span data-t="autoPlay"></span></label>
    <p><button type="button" class="btn quiet" id="reset" data-t="reset"></button></p>
  </details>
  <section class="sets" id="sets"><h2 data-t="setsTitle"></h2><div class="setlist" id="setList"></div></section>
  <footer><a class="btn quiet" id="micLink" data-t="micCheck"></a></footer>
</div>

// ---- числа: распознаватель возвращает цифры («ho 20 anni»), сравниваем со словами
const NUM1 = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
const TENS = ["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
function numToIt(n){
  n = Number(n); if (!(n >= 0 && n < 1e6) || n !== Math.floor(n)) return null;

  if (n < 100) { const t = Math.floor(n / 10), u = n % 10; let s = TENS[t]; if (u === 1 || u === 8) s = s.slice(0, -1); return u === 0 ? s : u === 3 ? s + "tré" : s + NUM1[u]; }

}
const expandNums = s => s.replace(/\d+/g, d => numToIt(d) ?? d);

// ---- сравнение: омофоны (ha/a, è/e…) звучат одинаково — верно; знак ударения распознаватель может опустить
const HOMO = { ha:"a", ho:"o", oh:"o", "è":"e", hanno:"anno", hai:"ai", "là":"la", "lì":"li", "dà":"da", "sì":"si", "né":"ne", "sé":"se" };

const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");

const looseT = t => deacc(canon(t)).replace(/'/g, "");
const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const within = (a, b) => { if (b.length >= a.length) return false; for (let i = 0; i + b.length <= a.length; i++) if (eq(a.slice(i, i + b.length), b)) return true; return false; };
const undouble = s => s.replace(/([b-df-hj-np-tv-z])\1/g, "$1");
function lev(a, b){ const m = a.length, n = b.length; if (Math.abs(m - n) > 1) return 2; let prev = Array.from({ length:n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
// Голосом границы слов не слышны: buona sera = buonasera, una mica = un'amica, 20 anni = vent'anni. Цифра 1 бывает вместо un, una, uno.
const glue = L => L.join("").replace("ventianni", "ventanni");

function compare(target, alts){

  const T = toks(target), Tc = T.map(canon), Tl = T.map(looseT), tj = Tl.join(" ");

    const Ac = A.map(canon), Al = A.map(looseT), aj = Al.join(" ");
    if (eq(Ac, Tc)) return { st:"ok", heard:a };
    if (eq(Al, Tl) || glue(Al) === glue(Tl)) return { st:"ok", heard:a, note:"accent" };
    if (within(Al, Tl)) return { st:"ok", heard:a, note:"extra" };

function mediaSrc(url){

function soundFail(){ note(t("soundFail"), true); }
function getPlayer(){ if (!player) { player = new Audio(); player.preload = "auto"; player.addEventListener("timeupdate", () => { if (stopAt && player.currentTime * 1000 >= stopAt) stopClip(); });

function whenFile(url, fn){
  const seq = ++clipSeq; whenLoaded = () => { if (seq === clipSeq) fn(seq); };
  if (playerReady === url) { playerSrc = url; const f = whenLoaded; whenLoaded = null; f(); return; }
  if (playerSrc === url) return;

}
// Файл не загрузился. Сообщаем, только если нажатие ещё ждёт его: ушедший с экрана ученик сообщения не ждёт.

// Позиция доступна, если файл в памяти или сервер даёт перемотку. Иначе браузер заиграл бы с начала файла, то есть чужой звук.
function canSeek(t){ if (t < 0.05 || player.currentSrc.startsWith("blob:")) return true; const r = player.seekable; for (let i = 0; r && i < r.length; i++) if (t >= r.start(i) && t <= r.end(i)) return true; return false; }

function clip(c){
  const p = getPlayer(); stopClip();
  whenFile("audio/" + c.f, seq => { if (!canSeek(c.s / 1000)) { soundFail(); return; } stopAt = c.s + c.d; p.currentTime = c.s / 1000; const pr = p.play(); (pr && pr.then ? pr : Promise.resolve()).then(() => clipEnd(seq, c.d)).catch(() => { if (seq === clipSeq) stopAt = 0; }); });

function speakTTS(t){

  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "it-IT"; const v = speechSynthesis.getVoices().find(v => /^it([-_]|$)/i.test(v.lang)); if (v) u.voice = v; u.rate = 0.85; speechSynthesis.speak(u); return true; } catch (e) { return false; }
}
function playCurrent(){ if (!cur) return; abortRec(); if (cur.clip && cur.clip.f) clip(cur.clip); else speakTTS(cur.it); }

// ---- распознавание
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, listening = false;
const micBtn = $("#mic"), micLabel = $("#micLabel"), interim = $("#interim"), result = $("#result"), notice = $("#notice");
function note(html, bad){ notice.innerHTML = html; notice.classList.toggle("bad", !!bad); notice.hidden = false; }
const NO_SR_SERVICE = t("noService");
const badBrowser = () => /OPR\//.test(navigator.userAgent) || !!navigator.brave;
const PHONE = /Android/i.test(navigator.userAgent);
// Браузеры на движке Chrome без доступа к службе распознавания называют себя только Chromium (проверено на Dia). Кнопку не отключаем: признак косвенный.
const noService = () => { const d = navigator.userAgentData; if (!d || !d.brands || d.mobile) return false; const b = d.brands.map(x => x.brand); return b.includes("Chromium") && !b.includes("Google Chrome") && !b.includes("Microsoft Edge"); };

const MIC_APP = t("micApp");
const MIC_SERVICE = t("micService");

const micState = async () => { try { return (await navigator.permissions.query({ name:"microphone" })).state; } catch (e) { return ""; } };

}
function envCheck(){
  if (!SR) { note(t("noSR"), true); micBtn.disabled = true; return; }
  if (badBrowser()) { note(NO_SR_SERVICE, true); micBtn.disabled = true; return; }
  if (noService()) { note(NO_SR_SERVICE, true); return; }
  if (location.protocol === "file:") { note(t("fileMode")); return; }
  if (window.isSecureContext === false) { note(t("insecure"), true); return; }
  if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:"microphone" }).then(p => { if (p.state === "denied") note(micDenied(), true); }).catch(() => {});
}
// Safari сам не заканчивает запись и может не прислать итог: попытку завершают пауза, кнопка или страховочные таймеры.
const SILENCE_MS = 1800, NO_SOUND_MS = 10000, STOP_WAIT_MS = 1200, MAX_MS = 10000;
const VERSION = "31.10-7", DEBUG = new URLSearchParams(location.search).has("debug");
const verEl = document.createElement("p"); verEl.className = "ver"; verEl.textContent = t("version") + " " + VERSION; document.body.appendChild(verEl);
const who = () => { const d = navigator.userAgentData, b = d && d.brands ? d.brands.map(x => x.brand).filter(x => !x.includes("Not")).join(", ") : ""; return (b ? b + " · " : "") + navigator.userAgent.replace("Mozilla/5.0 ", "").slice(0, 120); };
let traceEl = null;
function traceShow(lines){ if (!traceEl) { traceEl = document.createElement("pre"); traceEl.className = "trace"; interim.after(traceEl); } traceEl.textContent = "версия " + VERSION + "\n" + who() + "\n" + lines.join("\n"); }
let finishRec = null, cancelRec = null;
const once = t => { const w = String(t).trim().split(" ").filter(Boolean), n = w.length, low = x => x.toLowerCase(); for (let p = 2; p <= n / 2; p++) if (n % p === 0 && w.every((x, i) => low(x) === low(w[i % p]))) return w.slice(0, p).join(" "); return t; };
function setListening(on){ listening = on; micBtn.classList.toggle("listening", on); micLabel.textContent = t(on ? "listening" : "mic"); }
function abortRec(){ if (cancelRec) cancelRec(); if (rec) { try { rec.onend = null; rec.abort(); } catch (e) {} rec = null; } setListening(false); interim.textContent = ""; }
function listen(){
  if (!SR || !cur) return;
  if (rec) { if (finishRec) finishRec(); return; }
  stopClip(); if ("speechSynthesis" in window) try { speechSynthesis.cancel(); } catch (e) {}
  result.hidden = true; interim.textContent = "";
  const r = new SR(); rec = r; r.lang = "it-IT"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let finals = null, lastInterim = "", failed = false, gotStart = false, settled = false, finishing = false, lastHeard = "", quietT = 0, stopT = 0, capT = 0; const t0 = Date.now();
  const trail = [], T = ev => { if (!DEBUG) return; trail.push(((Date.now() - t0) / 1000).toFixed(1) + " " + ev); traceShow(trail.length > 14 ? trail.slice(0, 4).concat("…", trail.slice(-9)) : trail); };

  if (st === "empty") { result.innerHTML = `${t("empty", MIC_PAGE)}${typeof r === "string" ? ` <span class="alts">(${esc(r)})</span>` : ""}`; return; }

// ---- навигация по набору
let set = SETS.find(s => s.id === store.set) || SETS[0], order = [], idx = 0, cur = null, wasPassed = null;
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function buildOrder(keepCurrent){
  let items = set.items; if (store.onlyNew) items = items.filter(it => !store.ok[it.id]);
  if (!items.length && set.items.length) items = set.items;
  order = store.shuffle ? shuffle(items) : items.slice();
  const k = keepCurrent && cur ? order.findIndex(it => it.id === cur.id) : -1; idx = k >= 0 ? k : 0;
}
function paintProgress(){
  const n = set.items.length, learned = okIn(set); paintLocks();
  $("#pos").textContent = set.id === "own" ? "" : order.length ? t(store.onlyNew && order.length !== n ? "posNew" : "posOf", idx + 1, order.length) : "";
  $("#learned").textContent = n ? t("learned", learned, n) : "";
  const met = n > 0 && learned >= needIn(set);
  $("#posLabel").textContent = set.id === "own" ? "" : t(set.id === "phrases" ? "posPhrase" : "posWord"); $("#need").textContent = n ? t(met ? "needMet" : "needN", needIn(set)) : "";
  $("#barPos").style.width = order.length ? (idx + 1) / order.length * 100 + "%" : "0"; $("#barOk").style.width = n ? learned / n * 100 + "%" : "0"; $("#barNeed").style.left = n ? needIn(set) / n * 100 + "%" : "0";
  // порог набора взят только что: для длинных наборов это наступает раньше конца списка
  if (wasPassed === false && met && COURSE.includes(set)) { $("#milestonePraise").innerHTML = praiseHtml("section"); stepLink($("#milestoneGo")); $("#milestone").hidden = false; confetti(); }
  wasPassed = met;
}
function paintList(){
  const list = $("#list"); if (set.id === "own") { list.innerHTML = ""; return; }
  list.innerHTML = order.map((it, i) => `<button type="button" class="chip${store.ok[it.id] ? " ok" : store.tries[it.id] ? " bad" : ""}" data-i="${i}"${i === idx ? ' aria-current="true"' : ""}>${esc(it.it)}</button>`).join("");
}
function showItem(play){
  cur = order[idx] || null; abortRec(); result.hidden = true; interim.textContent = ""; $("#again").hidden = true;
  $("#word").textContent = cur ? cur.it : (set.id === "own" ? "" : t("noWords"));
  $("#tr").textContent = cur ? cur.tr || "" : "";
  $("#prev").disabled = order.length < 2; $("#next").disabled = !cur || set.id === "own"; $("#next").textContent = t(idx === order.length - 1 ? "last" : "next");
  micBtn.disabled = !SR || !cur; $("#play").disabled = !cur;
  paintProgress(); paintList();
  const chip = $(`.chip[data-i="${idx}"]`); if (chip && chip.scrollIntoView) chip.scrollIntoView({ block:"nearest" });
  if (play && cur && store.autoPlay) playCurrent();
}
function showLocked(st, b){
  abortRec(); $("#work").hidden = true; $("#list").innerHTML = ""; $("#own").hidden = true; $("#whereProg").hidden = true; $("#wordsBox").hidden = true; $("#locked").hidden = false; $("#setTitle").textContent = st.title; $("#lockedTitle").textContent = t("lockedTitle");
  $("#lockedText").textContent = t("lockedText", okIn(b), needIn(b)).replace("{n}", () => b.title.replace(/ \(\d+\)$/, "")); document.querySelector(".controls").style.display = "none";
  const go = $("#lockedGo"); go.textContent = t("lockedGo"); go.href = `?lang=${lang}#${b.id}`;
}
function chooseSet(id){ set = SETS.find(s => s.id === id) || SETS[0]; $("#locked").hidden = true; $("#finish").hidden = true; $("#milestone").hidden = true; $("#work").hidden = false; wasPassed = null; document.querySelector(".controls").style.display = ""; const lk = blockerOf(set); if (lk) { showLocked(set, lk); return; } store.set = set.id; save(); $("#setTitle").textContent = set.title; $("#own").hidden = set.id !== "own"; $("#whereProg").hidden = $("#wordsBox").hidden = set.id === "own"; cur = null; buildOrder(false); showItem(false); if (set.id === "own") $("#ownText").focus(); }
// Куда идти дальше: следующий набор курса, а если страница открыта из тетради или курс кончился, обратно в тетрадь.
function stepLink(a){
  const i = COURSE.indexOf(set), nx = COURSE[i + 1], home = document.body.classList.contains("locked") || !nx; a.hidden = i < 0; delete a.dataset.set;
  a.textContent = t(home ? "toNotebook" : "finishNext"); if (home) a.href = $("a.back").href; else { a.href = `?lang=${lang}#${nx.id}`; a.dataset.set = nx.id; }
}

  abortRec(); stopClip(); $("#work").hidden = true; $("#wordsBox").hidden = true; $("#milestone").hidden = true; document.querySelector(".controls").style.display = "none"; $("#finish").hidden = false;
  const ok = okIn(set), n = set.items.length, need = needIn(set), low = ok < need, stars = starsFor(ok, n, need), go = $("#finishNext");
  $("#finishTitle").textContent = t(low ? "finishLow" : "finishOk");
  $("#finishScore").textContent = low ? t("finishNeed", ok, n, need) : t("finishScore", ok, n);
  paintStars(stars); $("#finishPraise").innerHTML = praiseHtml(low ? "retry" : stars === 3 ? "perfect" : "good"); $("#finish").classList.toggle("low", low);
  stepLink(go); go.hidden = go.hidden || low; $("#restart").classList.toggle("primary", go.hidden);
  if (!low) confetti();
}
// Новый круг по тому же набору. Отметки «верно» остаются: по ним считаются замки.
function restart(){ $("#finish").hidden = true; $("#work").hidden = false; $("#wordsBox").hidden = false; document.querySelector(".controls").style.display = ""; cur = null; buildOrder(false); showItem(false); }
function ownShow(){
  const text = $("#ownText").value.trim(); if (!text) return;
  const k = norm(text), w = DATA.words[k], ph = DATA.phrases.find(p => norm(p.it) === k);
  cur = { id:"own:" + k, it:text, tr: w ? trOf(k) : ph ? phraseTr(ph) : "", clip: w || ph || null }; order = [cur]; idx = 0;
  abortRec(); result.hidden = true; interim.textContent = ""; $("#again").hidden = true;
  $("#word").textContent = cur.it; $("#tr").textContent = cur.tr; micBtn.disabled = !SR; $("#play").disabled = false; $("#prev").disabled = $("#next").disabled = true; paintProgress(); paintList(); playCurrent();
}

// ---- события
$("#shuffle").checked = !!store.shuffle; $("#onlyNew").checked = !!store.onlyNew; $("#autoPlay").checked = store.autoPlay !== false;
$("#shuffle").addEventListener("change", e => { store.shuffle = e.target.checked; save(); buildOrder(true); showItem(false); });
$("#onlyNew").addEventListener("change", e => { store.onlyNew = e.target.checked; save(); buildOrder(true); showItem(false); });

micBtn.addEventListener("click", listen);
$("#play").addEventListener("click", playCurrent);
$("#again").addEventListener("click", listen);
$("#next").addEventListener("click", () => { if (!order.length || $("#work").hidden) return; if (idx === order.length - 1) { showFinish(); return; } idx++; showItem(true); });

document.addEventListener("click", e => { const s = e.target.closest("[data-say]"), a = e.target.closest("[data-set]"); if (s) { const c = PRAISE_AUDIO[s.dataset.say]; if (c) clip({ f:"parlare58.mp3", s:c[0], d:c[1] }); else speakTTS(s.dataset.say); } if (a && !a.disabled) { e.preventDefault(); chooseSet(a.dataset.set); const top = $(".where"); if (top.scrollIntoView) top.scrollIntoView({ block:"start" }); } });

$("#ownText").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ownShow(); } });
$("#reset").addEventListener("click", e => { const b = e.currentTarget, now = Date.now(); if (b.dataset.arm) { if (now - Number(b.dataset.arm) < 800) return; store.ok = {}; store.tries = {}; save(); delete b.dataset.arm; b.textContent = t("reset"); chooseSet(set.id); } else { b.dataset.arm = String(now); b.textContent = t("resetSure"); setTimeout(() => { delete b.dataset.arm; b.textContent = t("reset"); }, 4000); } });

envCheck();
// Набор по адресу: тетрадь открывает тренажёр ссылкой вида …/#u0-ua (юнит-раздел); неизвестный id — последний выбранный набор.
const fromHash = () => { let id = ""; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {} return SETS.some(st => st.id === id) ? id : ""; };
// Открыто из тетради: показываем только набор раздела, без выбора других наборов (режим «locked»).
const lockTo = id => { document.body.classList.toggle("locked", !!id); if (id) chooseSet(id); };
paintLocks(); lockTo(fromHash()); if (!fromHash()) chooseSet(blockerOf(set) ? blockerOf(set).id : set.id);
window.addEventListener("hashchange", () => lockTo(fromHash()));
</script>
