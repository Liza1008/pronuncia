<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Разговор и письмо</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
:root{--paper:#f5f7fb;--card:#fff;--ink:#152033;--muted:#566377;--rule:#e0e6ef;--accent:#1e78ff;--accent-ink:#0b5bd3;--accent-soft:#e4efff;--on-accent:#06101f;--ok:#17795f;--ok-soft:#dff4ed;--bad:#c22437;--bad-soft:#ffe3e8;--near:#8f5e00;--near-soft:#fff3cc;--verde:#42b192;--verde-soft:#dff4ed;--verde-edge:#2b8a70;--on-verde:#04231a;--rosso:#e5324d;--rosso-soft:#ffe3e8;--rosso-edge:#b31e36;--on-rosso:#14060a;--sole:#ffb300;--sole-soft:#fff3cc;--mare:#1e78ff;--viola:#7c4dff;--viola-soft:#eee8ff;--track:rgba(21,32,51,.13);--shadow:rgba(20,30,50,.13);--font-ui:"Golos Text","Segoe UI",system-ui,sans-serif;--font-serif:"Literata",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root{--paper:#0e1420;--card:#182130;--ink:#eef2f9;--muted:#a8b3c6;--rule:#2b3648;--accent:#6ea8ff;--accent-ink:#6ea8ff;--accent-soft:#17294a;--on-accent:#08111f;--ok:#6fd4b6;--ok-soft:#17443a;--bad:#ff8a8f;--bad-soft:#40202a;--near:#f2bb55;--near-soft:#40351a;--verde:#42b192;--verde-soft:#17443a;--verde-edge:#2b8a70;--on-verde:#04231a;--rosso:#ff6b7f;--rosso-soft:#40202a;--rosso-edge:#d14358;--on-rosso:#14060a;--sole:#ffc83d;--sole-soft:#40351a;--mare:#6ea8ff;--viola:#b49cff;--viola-soft:#2c2450;--track:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-ui)}
body::before{content:"";display:block;height:5px;background:linear-gradient(90deg,#009246 0 33.33%,#fff 33.33% 66.66%,#ce2b37 66.66%);box-shadow:0 1px 0 var(--rule)}
a{color:var(--accent-ink)}
[hidden]{display:none !important}
p{margin:6px 0}
.wrap{max-width:760px;margin:0 auto;padding:10px 14px 36px}
.head{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;font-size:.95rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:12px;min-height:44px;padding:6px 8px;max-width:100%}
select{contain:paint}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 1rem/1.25 var(--font-ui);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:14px;min-height:44px;padding:9px 16px;box-shadow:0 3px 0 var(--rule);cursor:pointer;max-width:100%;text-decoration:none;text-align:center}
.btn:active:not([disabled]),.mic:active:not([disabled]),.say:active:not([disabled]),.keys button:active,.sayp:active{transform:translateY(2px)}
.btn:active:not([disabled]){box-shadow:0 1px 0 var(--rule)}
.btn.primary{background:var(--verde);color:var(--on-verde);border-color:transparent;box-shadow:0 3px 0 var(--verde-edge)}
.btn.primary:active:not([disabled]){box-shadow:0 1px 0 var(--verde-edge)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent-ink);padding:8px 2px;font-weight:500}
.btn.quiet{background:transparent;box-shadow:none;color:var(--muted);font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.where{background:var(--work-soft);border-radius:16px;padding:10px 14px 12px;margin:0 0 12px}
.where h1{font:700 1.15rem/1.2 var(--font-serif);margin:0}
.place{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.place b,.set-title{font:600 1.05rem/1.3 var(--font-ui);margin:4px 0 0;overflow-wrap:anywhere}
.bar{position:relative;height:14px;border-radius:99px;background:var(--track);margin:8px 0 4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
#barPos{background:var(--work);opacity:.3}
#barOk{background:linear-gradient(90deg,var(--verde),var(--sole))}
#barNeed{width:3px;top:-3px;bottom:-3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.progress{display:flex;flex-wrap:wrap;gap:0 14px;font-size:.95rem;color:var(--ink)}
.progress #need{font-weight:600}
.card{background:var(--card);border-radius:16px;padding:18px 16px;margin:0 0 14px;box-shadow:0 6px 20px var(--shadow)}
.notice{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--near-soft)}
.notice.bad{background:var(--bad-soft)}
.notice code{font-size:.95em;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:16px 0 8px}
.mic{display:flex;align-items:center;justify-content:center;gap:12px;flex:1 1 100%;width:100%;max-width:460px;min-height:76px;margin:0 max(0px,calc(50% - 230px));padding:14px 20px;font:700 1.35rem/1.2 var(--font-ui);border:0;border-radius:14px;background:var(--verde);color:var(--on-verde);box-shadow:0 3px 0 var(--verde-edge);cursor:pointer}
.mic svg{width:32px;height:32px}
.mic:active:not([disabled]){box-shadow:0 1px 0 var(--verde-edge)}
.mic.listening{background:var(--rosso);color:var(--on-rosso);box-shadow:0 3px 0 var(--rosso-edge);animation:pulse 1.1s infinite}
.mic[disabled]{opacity:.5;cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--rosso-edge),0 0 0 0 rgba(229,50,77,.55)}50%{box-shadow:0 3px 0 var(--rosso-edge),0 0 0 16px rgba(229,50,77,0)}}
.say{display:inline-flex;align-items:center;gap:8px;font:500 .95rem var(--font-ui);min-height:44px;padding:8px 14px;border-radius:14px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
.say svg{width:18px;height:18px}
.say[disabled]{opacity:.55;cursor:default}
.interim{color:var(--muted);font-style:italic;margin-top:6px;text-align:center}
.interim:empty{margin:0}
.trace{font:.72rem/1.35 ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.result{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--paper)}
.result.ok{background:var(--ok-soft)}
.result.bad{background:var(--bad-soft)}
.result.near{background:var(--near-soft)}
.result a{font-weight:600}
.alts{color:var(--muted);font-size:.95rem;display:block;margin-top:4px;overflow-wrap:anywhere}
.praise{display:flex;flex-wrap:wrap;align-items:center;gap:0 12px}
.praise b{font:700 1.5rem/1.25 var(--font-serif);color:var(--ok)}
.sayp{font:inherit;font-size:1.2rem;min-width:44px;min-height:44px;padding:0;border:0;border-radius:14px;background:transparent;cursor:pointer}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.card:has(.result.ok:not([hidden])) #next{background:var(--verde);color:var(--on-verde);border-color:transparent;box-shadow:0 3px 0 var(--verde-edge)}
.card:has(.result.ok:not([hidden])) .mic:not(.listening),.card:has(.result.ok:not([hidden])) #check{background:var(--card);color:var(--ink);border:1px solid var(--rule);box-shadow:0 3px 0 var(--rule);min-height:52px;font-size:1.05rem}
.finish{text-align:center}
.finish h2{font:700 1.3rem/1.25 var(--font-serif);margin:6px 0 6px}
.finish .praise{justify-content:center}
.finish .praise b{flex:1 1 100%;font-size:2.1rem}
.finish.low .praise b{color:var(--near)}
.finish .praise span{font-size:1.15rem}
.finish .nav{justify-content:center;flex-direction:column;align-items:center}
.finish .nav .btn{width:100%;max-width:400px}
.finish .nav .btn.primary{min-height:60px;font-size:1.15rem}
.stars{font-size:2.6rem;line-height:1.1;letter-spacing:.06em}
#locked{text-align:center}
#locked h2{font:700 1.3rem/1.25 var(--font-serif);margin:0 0 6px}
#locked h2::before{content:"🔒 "}
#locked .nav{justify-content:center}
.sets{margin-top:20px}
.sets h2{font:700 1.15rem/1.3 var(--font-ui);margin:0 0 10px}
.setlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.setcard{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:9px 12px;border:2px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);font:inherit;text-align:left;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.setcard .ic{font-size:1.4rem;line-height:1;flex:none}
.setcard .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.setlist .unit{grid-column:1/-1;font:600 .95rem/1.3 var(--font-ui);color:var(--muted);margin:8px 0 0}
.setlist .unit:first-child{margin-top:0}
.setcard b{display:block;font-weight:600;line-height:1.3}
.setcard .st{display:block;font-size:.9rem;color:var(--muted)}
.setcard.done{background:var(--verde-soft)}
.setcard.done .st{color:var(--ok);font-weight:600}
.setcard.next{background:var(--work-soft);border-color:var(--work);box-shadow:0 3px 0 var(--work)}
.setcard.next .st{color:var(--ink);font-weight:700}
.setcard.lock{min-height:48px;padding:6px 12px;background:transparent;border:2px dashed var(--rule);box-shadow:none;cursor:default}
.setcard.lock .ic{font-size:1.1rem}
.setcard.lock .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 10px}
.setcard.lock b{font-weight:500;color:var(--muted)}
.setcard[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.more{margin-top:10px;color:var(--muted)}
.more summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:500}
.more summary::before{content:"▸";margin-right:8px}
.more[open] summary::before{content:"▾"}
.more[open]{color:var(--ink)}
footer{margin-top:18px}
.ver{font-size:.75rem;color:var(--muted);text-align:center;margin:10px 0 20px}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg)}}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.setcard:focus-visible{outline:3px solid var(--mare);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}.btn:active,.mic:active,.say:active,.keys button:active,.sayp:active{transform:none !important}.confetti{display:none}}
body{--work:var(--viola);--work-soft:var(--viola-soft)}
.where h1::before{content:"🗣 "}
.place #setUnit{color:var(--muted)}
.task{font-weight:600;text-align:center;margin:0 0 4px}
.prompt{font:700 clamp(1.45rem,5.5vw,2rem)/1.25 var(--font-serif);margin:4px 0 6px;text-align:center;overflow-wrap:anywhere}
.prompt.it{font-style:italic}
.hintline{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem;letter-spacing:.06em;color:var(--ink);min-height:1.6em;margin:6px 0 2px;overflow-wrap:anywhere;text-align:center}
.hintline.tr{font-family:var(--font-ui);font-size:1.1rem;letter-spacing:0}
.hintline b{color:var(--ok)}
.write{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.write input{flex:1 1 260px;min-width:0;font:inherit;font-size:1.15rem;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:14px;min-height:56px;padding:10px 12px}
.write input:focus{border-color:var(--verde);outline:none}
.write .btn{flex:1 1 150px;min-height:60px;font-size:1.25rem}
.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 6px}
.keys button{font:inherit;font-size:1.05rem;min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--rule)}
.result .diff mark{background:transparent;color:var(--bad);font-weight:700;text-decoration:underline}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
</style>
</head>

  $("#answer").value = ""; $("#play").hidden = !isQ; $("#playLabel").textContent = t(isQ ? "playQuestion" : "playAnswer");
  $("#next").textContent = t(idx === deck.length - 1 ? "last" : "next"); $("#prev").disabled = idx === 0;
  if (ONE) { $("#progress").hidden = true; $("#setName").hidden = true; $("#nav").hidden = true; }
  else { $("#setName").textContent = SETS[setId].name; store.pos[setId] = idx; save(); }
  paintProgress();
  if (!say) setTimeout(() => $("#answer").focus({ preventScroll:true }), 0);
}
function showFinish(){
  abortRec(); $("#card").hidden = true; $("#finish").hidden = false;
  const ok = passed(), n = deck.length, need = needIn(setId), again = ok < need && setPassed(setId), low = ok < need && !again, stars = starsFor(ok, n, need), nx = ORDER[ORDER.indexOf(setId) + 1], go = $("#finishNext");
  $("#finishTitle").textContent = t(low ? "finishLow" : again ? "finishBefore" : "finishTitle");
  $("#finishScore").textContent = low ? t("finishNeed", ok, n, need) : again ? t("finishBest", ok, n, bestIn(setId)) : t("finishScore", ok, n);
  paintStars(stars); $("#finishPraise").innerHTML = praiseHtml(low || again ? "retry" : stars === 3 ? "perfect" : "good"); $("#finish").classList.toggle("low", low || again);
  go.hidden = low; go.textContent = t(nx ? "finishNext" : "toNotebook"); go.href = nx ? `?lang=${lang}#${nx}` : $("#back").href;
  $("#restart").classList.toggle("primary", low);
  if (!low && !again) confetti();
}
function showLocked(){
  abortRec(); $("#card").hidden = true; $("#locked").hidden = false; $("#lockedTitle").textContent = t("lockedTitle");
  $("#lockedText").textContent = t("lockedText", bestIn(blocker), SETS[blocker].items.length, needIn(blocker), SETS[blocker].name);
  const go = $("#lockedGo"); go.textContent = t("lockedGo"); go.href = `?lang=${lang}#${blocker}`;
}
function restart(){
  store.best[setId] = bestIn(setId);
  store.decks[setId] = deck = makeDeck(); deck.forEach(e => { delete store.ok[`${setId}:${e[0]}`]; }); idx = 0; store.pos[setId] = 0; save();
  $("#finish").hidden = true; $("#card").hidden = false; render();
}
// статические подписи
document.title = t("title"); $("#title").textContent = t("title"); $("#back").textContent = t("back"); $("#answer").placeholder = t("placeholder"); $("#check").textContent = t("check"); $("#prev").textContent = t("prev"); $("#again").textContent = t("again"); micLabel.textContent = t("mic");
$("#restart").textContent = t("restart"); $("#setsTitle").textContent = t("setsTitle"); $("#posLabel").textContent = t("posLabel"); $("#micLink").textContent = t("micCheck"); $("#toWrite").textContent = t("toWrite"); $("#micLink").href = "mic.html?lang=" + lang;
if (ONE) { const d = document.createElement("p"); d.id = "oneDone"; d.className = "task"; d.hidden = true; d.textContent = t("oneDone"); $("#card").appendChild(d); }

$("#next").addEventListener("click", () => { if (idx >= deck.length - 1) { showFinish(); return; } idx++; render(); });
$("#prev").addEventListener("click", () => { if (idx > 0) { idx--; render(); } });
$("#hint").addEventListener("click", () => { if (hintLevel >= 2) return; hintLevel++; $("#hintline").innerHTML = skeleton(cur().it[0], hintLevel); paintHint(); });
$("#play").addEventListener("click", () => { abortRec(); stopClip(); const it = cur(); speak(it.t === "q" && !tried ? it.q : sample(it)); });
micBtn.addEventListener("click", listen);
$("#toWrite").addEventListener("click", () => { writeHere = entry(); notice.hidden = true; render(); });
$("#again").addEventListener("click", () => { if (kind() === "write") { $("#answer").value = ""; result.hidden = true; $("#again").hidden = true; $("#answer").focus(); } else listen(); });
$("#restart").addEventListener("click", restart);
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });
const checkWritten = () => { const v = $("#answer").value; if (!v.trim()) { show({ st:"empty" }, "", "", false); return; } const r = judge(v, variants(cur()), false); if (!ONE) { store.tries[id()] = (store.tries[id()] || 0) + 1; if (r.st === "ok") store.ok[id()] = true; save(); } show(r, "", v, false); paintProgress(); };
$("#check").addEventListener("click", checkWritten);
$("#answer").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkWritten(); } });
$("#keys").addEventListener("pointerdown", e => e.preventDefault());
$("#keys").addEventListener("click", e => { const b = e.target.closest("button[data-ch]"); if (!b) return; const a = $("#answer"), s = a.selectionStart ?? a.value.length, u = a.selectionEnd ?? s; a.value = a.value.slice(0, s) + b.dataset.ch + a.value.slice(u); a.selectionStart = a.selectionEnd = s + 1; a.focus(); });
window.addEventListener("hashchange", () => location.reload());
if (ONE) $("#sets").hidden = true;
else { $("#setUnit").textContent = unitOf(setId); $("#setName").textContent = SETS[setId].name; $("#progress").hidden = !!blocker; paintSets(); }
if (blocker) showLocked(); else render();
</script>
</body>
