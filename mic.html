<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Pronuncia</title>
<style>
:root{--paper:#f3f5f9;--card:#fff;--ink:#17202d;--muted:#5a6577;--rule:#dce2ea;--accent:#2347c4;--on-accent:#fff;--ok:#17794a;--bad:#b8322a;--near:#9a6500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f141b;--card:#161d27;--ink:#e4e9f1;--muted:#97a3b5;--rule:#283241;--accent:#8ca9ff;--on-accent:#0d1320;--ok:#55c78d;--bad:#ff7f74;--near:#f0b64a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f141b;--card:#161d27;--ink:#e4e9f1;--muted:#97a3b5;--rule:#283241;--accent:#8ca9ff;--on-accent:#0d1320;--ok:#55c78d;--bad:#ff7f74;--near:#f0b64a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.4rem;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:6px 10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.yes{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600} .maybe{color:var(--near);font-weight:600}
.btn{font:inherit;font-size:1rem;padding:12px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;margin:6px 8px 6px 0}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px;font-size:.85rem;min-height:80px;margin:10px 0 0}
.big{font-size:1.1rem;padding:10px 12px;border-radius:10px;margin-top:10px;border:1px solid var(--rule)}
.big.ok{border-color:var(--ok);color:var(--ok)} .big.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><select id="langSel"></select></div>
  <p><a id="toTrainer" href="index.html"></a> · <a id="toTalk" href="parlare.html"></a></p>
  <p class="muted" id="intro"></p>
  <div class="card" id="env"></div>
  <div class="card">
    <button type="button" class="btn" id="sr"></button>
    <button type="button" class="btn ghost" id="gum"></button>
    <div class="big" id="verdict" hidden></div>
    <pre id="log"></pre>
  </div>
</div>

row(t("rowSecure"), t(window.isSecureContext ? "yes" : "no"), window.isSecureContext ? "yes" : "no");
let fp = t("policyUnknown"), fpc = "maybe";
try { const p = document.featurePolicy || document.permissionsPolicy; if (p && p.allowsFeature) { const a = p.allowsFeature("microphone"); fp = t(a ? "policyOn" : "policyOff"); fpc = a ? "yes" : "no"; } } catch (e) {}
row(t("rowPolicy"), fp, fpc);
row(t("rowSr"), t(SR ? "has" : "hasNot"), SR ? "yes" : "no");
const hasGum = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
row(t("rowGum"), t(hasGum ? "has" : "hasNot"), hasGum ? "yes" : "no");
if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:"microphone" }).then(p => row(t("rowPerm"), p.state, p.state === "granted" ? "yes" : p.state === "denied" ? "no" : "maybe")).catch(e => row(t("rowPerm"), t("permFail", e && e.message || e), "maybe"));
row(t("rowBrowser"), navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 90));
const badBrowser = /OPR\//.test(navigator.userAgent) || !!navigator.brave;
row(t("rowService"), t(badBrowser ? "serviceNo" : "serviceYes"), badBrowser ? "no" : "yes");
const PHONE = /Android/i.test(navigator.userAgent);
if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) navigator.userAgentData.getHighEntropyValues(["platformVersion", "model"]).then(v => row(t("rowDevice"), [navigator.userAgentData.platform, v.platformVersion, v.model].filter(Boolean).join(" "))).catch(() => {});
const quoted = s => t("vWorks", s);
// на Android not-allowed дают и запрет сайту, и приложение Chrome без разрешения, и служба распознавания
async function explainRefusal(){
  let st = "", mic = false;
  try { st = (await navigator.permissions.query({ name:"microphone" })).state; } catch (e) {}
  put(t("logSitePerm", st || t("unknown")));
  if (st !== "denied") try { const s = await navigator.mediaDevices.getUserMedia({ audio:true }); s.getTracks().forEach(x => x.stop()); mic = true; put(t("logGumOk")); } catch (e) { put("getUserMedia: " + (e && e.name)); }
  verdict(false, t(st === "denied" ? "vChromeDenied" : mic ? "vService" : "vApp"));
}
const verdict = (ok, text) => { const v = $("#verdict"); v.hidden = false; v.className = "big " + (ok ? "ok" : "bad"); v.textContent = text; };
$("#sr").addEventListener("click", () => {
  if (!SR) { put(t("logNoSR")); verdict(false, t("vNoSR")); return; }
  put(t("logStart"));
  const r = new SR(); r.lang = "it-IT"; r.interimResults = true; r.maxAlternatives = 3;
  let got = false, quiet = 0, heard = "";
  r.onstart = () => put(t("logOnstart"));
  r.onaudiostart = () => put(t("logAudio"));
  r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) { const res = e.results[i]; const alts = []; for (let k = 0; k < res.length; k++) alts.push(res[k].transcript); put(t(res.isFinal ? "logFinal" : "logInterim") + alts.join(" | ")); if (!res.isFinal && alts[0] !== heard) { heard = alts[0]; clearTimeout(quiet); quiet = setTimeout(() => { if (got) return; got = true; put(t("logPause")); verdict(true, quoted(alts[0])); try { r.stop(); } catch (e) {} }, 2500); } if (res.isFinal) { got = true; verdict(true, quoted(alts[0])); } } };
  r.onerror = e => { put("onerror: " + (e && e.error) + (e && e.message ? " — " + e.message : "")); if (e && (e.error === "not-allowed" || e.error === "service-not-allowed")) { verdict(false, t("vClosed", e.error)); if (PHONE) explainRefusal(); } else if (e && e.error === "network") verdict(false, t(navigator.onLine === false ? "vOffline" : "vNet"));
    else if (e && e.error === "no-speech") verdict(false, t("vNoSpeech")); else verdict(false, t("vError", e && e.error)); };
  r.onend = () => { put("onend" + (got ? "" : t("logNoResult"))); if (!got && $("#verdict").hidden) verdict(false, t(badBrowser ? "vBadBrowser" : "vNoResult")); };
  try { r.start(); } catch (e) { put(t("logThrew", e && e.message || e)); verdict(false, t("vCantStart", e && e.message || e)); }
});
$("#gum").addEventListener("click", async () => {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { put(t("logNoGum")); verdict(false, t("vNoGum")); return; }
  put(t("logAsk"));
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio:true });
    const tr = s.getAudioTracks()[0];
    put(t("logOpen", tr && tr.label || t("unnamed")));
    verdict(true, t("vGumOk", tr && tr.label || t("unnamedDev")));
    s.getTracks().forEach(x => x.stop()); put(t("logClosed"));
  } catch (e) { put(t("logErr", (e && e.name) + " — " + (e && e.message))); verdict(false, t("vGumNo", (e && e.name) + (e && e.message ? " (" + e.message + ")" : ""))); }
});
