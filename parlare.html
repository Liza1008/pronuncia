<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Разговор и письмо</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
:root{--paper:#f3f5f9;--card:#fff;--ink:#17202d;--muted:#5a6577;--rule:#dce2ea;--accent:#2347c4;--accent-soft:#e8edfb;--on-accent:#fff;--ok:#17794a;--ok-soft:#e3f3ea;--bad:#b8322a;--bad-soft:#fbe7e5;--near:#9a6500;--near-soft:#fff3d6;--shadow:rgba(20,30,50,.14);--font-ui:"Golos Text",system-ui,sans-serif;--font-serif:"Literata",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--paper:#0f141b;--card:#161d27;--ink:#e4e9f1;--muted:#97a3b5;--rule:#283241;--accent:#8ca9ff;--accent-soft:#1c2740;--on-accent:#0d1320;--ok:#55c78d;--ok-soft:#163626;--bad:#ff7f74;--bad-soft:#3a1f1c;--near:#f0b64a;--near-soft:#3a2f14;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font-ui)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 1.5rem/1.2 var(--font-serif);margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.notice{margin:16px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--near);background:var(--near-soft)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
[hidden]{display:none !important}
.btn{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;cursor:pointer;max-width:100%}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);text-decoration:none}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px 24px;box-shadow:0 8px 24px var(--shadow)}
.progress{color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.set{color:var(--muted);font-size:.85rem;margin:2px 0 0;font-style:italic}
.task{color:var(--muted);font-size:.9rem;margin:10px 0 2px}
.prompt{font:600 clamp(1.3rem,4vw,1.8rem)/1.25 var(--font-serif);margin:4px 0 6px}
.prompt.it{font-style:italic}
.hintline{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem;letter-spacing:.06em;color:var(--muted);min-height:1.6em;margin:6px 0 2px;overflow-wrap:anywhere}
.hintline.tr{font-family:var(--font-ui);font-size:1rem;letter-spacing:0}
.hintline b{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 8px}
.mic{display:inline-flex;align-items:center;gap:10px;font:600 1.05rem var(--font-ui);padding:14px 22px;border-radius:99px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.mic svg{width:22px;height:22px}
.mic.listening{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
.mic[disabled]{opacity:.5;cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,50,42,.45)}50%{box-shadow:0 0 0 12px rgba(184,50,42,0)}}
.say{display:inline-flex;align-items:center;gap:8px;font:500 .95rem var(--font-ui);padding:10px 16px 10px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--card);color:var(--accent);cursor:pointer}
.say svg{width:18px;height:18px}
.write{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.write input{flex:1 1 260px;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.write input:focus{border-color:var(--accent);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.keys button{font:inherit;font-size:1rem;padding:4px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.interim{color:var(--muted);font-style:italic;min-height:1.5em;margin-top:6px}
.trace{font:.72rem/1.35 ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.ver{font-size:.72rem;color:var(--muted);text-align:center;margin:14px 0 24px}
.result{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--rule)}
.result.ok{border-color:var(--ok);background:var(--ok-soft)}
.result.bad{border-color:var(--bad);background:var(--bad-soft)}
.result.near{border-color:var(--near);background:var(--near-soft)}
.result b{font-size:1.05rem}
.result .diff mark{background:transparent;color:var(--bad);font-weight:700;text-decoration:underline}
.result .alts{color:var(--muted);font-size:.9rem;display:block;margin-top:4px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.finish h2{font:700 1.35rem/1.25 var(--font-serif);margin:0 0 8px}
footer{color:var(--muted);font-size:.85rem;margin-top:28px;line-height:1.5}
.btn:focus-visible,.mic:focus-visible,.say:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#langSel{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>
    <div class="head-r"><select id="langSel"></select><a class="btn ghost" id="back" href="https://claude.ai/artifact/2dHceWUgiBVyDRLb81RwQ5"></a></div>
  </header>
  <div class="notice" id="notice" hidden role="status"></div>
  <section class="card" id="card" aria-live="polite">
    <div class="progress" id="progress"><span id="pos"></span><span id="done"></span></div>
    <p class="set" id="setName"></p>
    <p class="task" id="task"></p>
    <div class="prompt" id="prompt"></div>
    <div class="hintline" id="hintline"></div>
    <div class="write" id="write" hidden><input type="text" id="answer" lang="it" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="btn primary" id="check"></button></div>
    <div class="keys" id="keys" hidden><button type="button" data-ch="à">à</button><button type="button" data-ch="è">è</button><button type="button" data-ch="é">é</button><button type="button" data-ch="ì">ì</button><button type="button" data-ch="ò">ò</button><button type="button" data-ch="ù">ù</button><button type="button" data-ch="'">'</button></div>
    <div class="actions">
      <button type="button" class="mic" id="mic"><span id="micIcon"></span><span id="micLabel"></span></button>
      <button type="button" class="btn" id="hint"></button>
      <button type="button" class="say" id="play"><span id="spk"></span><span id="playLabel"></span></button>
    </div>
    <div class="interim" id="interim"></div>
    <div class="result" id="result" hidden></div>
    <div class="nav" id="nav"><button type="button" class="btn" id="prev"></button><button type="button" class="btn" id="again" hidden></button><button type="button" class="btn primary" id="next"></button></div>
  </section>
  <section class="card finish" id="finish" hidden>
    <h2 id="finishTitle"></h2>
    <p id="finishScore"></p>
    <div class="nav"><button type="button" class="btn primary" id="restart"></button></div>
  </section>
  <footer><p id="how"></p><p id="voice"></p></footer>
</div>

const KEY = "parlare-v1";
const store = { lang:"", decks:{}, ok:{}, tries:{}, pos:{} };
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const params = new URLSearchParams(location.search);
const lang = I18N[params.get("lang")] ? params.get("lang") : I18N[store.lang] ? store.lang : "ru";
store.lang = lang; document.documentElement.lang = lang;
const t = (k, a, b) => String(I18N[lang][k] ?? I18N.ru[k] ?? k).replace("{a}", () => a).replace("{b}", () => b).replace("{l}", lang);
const langSel = $("#langSel"); langSel.setAttribute("aria-label", { ru:"Язык", en:"Language", uk:"Мова" }[lang]);
[["ru", "Русский"], ["en", "English"], ["uk", "Українська"]].forEach(([v, n]) => langSel.insertAdjacentHTML("beforeend", `<option value="${v}"${v === lang ? " selected" : ""}>${n}</option>`));
langSel.addEventListener("change", () => { const u = new URL(location.href); u.searchParams.set("lang", langSel.value); location.href = u.href; });

// ---- числа и нормализация (как в тренажёре слов)
const NUM1 = ["zero","uno","due","tre","quattro","cinque","sei","sette","otto","nove","dieci","undici","dodici","tredici","quattordici","quindici","sedici","diciassette","diciotto","diciannove"];
const TENS = ["","","venti","trenta","quaranta","cinquanta","sessanta","settanta","ottanta","novanta"];
function numToIt(n){
  n = Number(n); if (!(n >= 0 && n < 1e6) || n !== Math.floor(n)) return null;
  if (n < 20) return NUM1[n];
  if (n < 100) { const t = Math.floor(n / 10), u = n % 10; let s = TENS[t]; if (u === 1 || u === 8) s = s.slice(0, -1); return u === 0 ? s : u === 3 ? s + "tré" : s + NUM1[u]; }
  if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; const s = (h === 1 ? "" : NUM1[h]) + "cento"; if (!r) return s; const rs = numToIt(r); return (rs[0] === "o" ? s.slice(0, -1) : s) + rs; }
  const k = Math.floor(n / 1000), r = n % 1000; const s = k === 1 ? "mille" : numToIt(k) + "mila"; return r ? s + numToIt(r) : s;
}
const expandNums = s => s.replace(/\d+/g, d => numToIt(d) ?? d);
const HOMO = { ha:"a", ho:"o", oh:"o", "è":"e", hanno:"anno", hai:"ai", "là":"la", "lì":"li", "dà":"da", "sì":"si", "né":"ne", "sé":"se" };
const norm = s => String(s ?? "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:«»"“”…()\-]/g, " ").replace(/\s+/g, " ").trim();
const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const toks = s => expandNums(norm(s)).split(" ").filter(Boolean);
const canon = t => HOMO[t] || t;
const looseT = t => deacc(canon(t)).replace(/'/g, "");
const eq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
// шаблон: * одно или несколько любых слов, _ ровно одно слово
const patRe = (pat, f) => new RegExp("^" + toks(pat).map(t => t === "*" ? "\\S+(?: \\S+)*" : t === "_" ? "\\S+" : f(t).replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "\\S*")).join(" ") + "$");
function tokLev(a, b){ const m = a.length, n = b.length; let prev = Array.from({ length:n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
// Сравнение ответа с вариантами. spoken: ударения и апострофы не важны; письменно без ударения — «почти».
function judge(answer, variants, spoken){
  const A = toks(answer); if (!A.length) return { st:"empty" };
  const C = spoken ? canon : (t => t);          // письменно омофоны не приравниваются: e ≠ è
  const Ac = A.map(C).join(" "), Al = A.map(looseT).join(" ");
  let accNear = null;
  for (const v of variants) {
    const hasStar = /[*_]/.test(v);
    if (hasStar) {
      if (patRe(v, C).test(Ac) || (spoken && patRe(v, looseT).test(Al))) return { st:"ok", v };
      if (!spoken && !accNear && patRe(v, looseT).test(Al)) accNear = { st:"near", v, note:"accent" };
      continue;
    }
    const V = toks(v);
    if (eq(A.map(C), V.map(C))) return { st:"ok", v };
    if (eq(A.map(looseT), V.map(looseT))) return spoken ? { st:"ok", v } : { st:"near", v, note:"accent" };
  }
  if (accNear) return accNear;
  let best = null;
  for (const v of variants) {
    if (/[*_]/.test(v)) continue;
    const V = toks(v).map(looseT), AL = A.map(looseT), d = tokLev(AL, V);
    if (d <= 1 && V.length >= 2 && (!best || d < best.d)) best = { st:"near", v, d, note:"word" };
  }
  return best || { st:"bad", v:variants[0] };
}
// Подсветка: слова образца, которых нет в ответе
function diffHtml(v, answer){ const A = new Set(toks(answer).map(looseT)); return v.split(/(\s+)/).map(p => /\s/.test(p) || !p ? p : (A.has(looseT(toks(p)[0] || "")) ? esc(p) : `<mark>${esc(p)}</mark>`)).join(""); }
// Подсказка: уровень 1 — первые буквы, 2 — первая и средняя. * показывается как …
function skeleton(v, level){
  return v.split(/(\s+)/).map(w => {
    if (/^\s*$/.test(w)) return w;
    if (w.includes("*")) return esc(w.replace(/\*/g, "…"));
    const m = w.match(/^([^\p{L}]*)(.*?)([^\p{L}]*)$/u); const pre = m[1], core = m[2], post = m[3];
    const chars = [...core]; const keep = new Set([0]); if (level >= 2 && chars.length >= 4) keep.add(Math.floor(chars.length / 2));
    const out = chars.map((c, i) => c === "'" ? "<b>'</b>" : keep.has(i) ? `<b>${esc(c)}</b>` : "_").join("");
    return esc(pre) + out + esc(post);
  }).join("");
}

// ---- набор заданий. #u0-ua — раздел; #one=… — одно задание из повторения в тетради.
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const rawHash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ""; } };
function readOne(){ const h = rawHash(); if (!h.startsWith("one=")) return null; try { const o = JSON.parse(h.slice(4)); return o && o.p && Array.isArray(o.it) && o.it.length ? o : null; } catch (e) { return null; } }
const ONE = readOne();
const setId = SETS[rawHash()] ? rawHash() : Object.keys(SETS)[0];
const items = ONE ? [{ t:"p", [lang]:ONE.p, it:ONE.it, s:ONE.s }] : SETS[setId].items;
// На фразу один тип; устные и письменные поровну, порядок случайный. Новый порядок и новые типы — при каждом «Пройти ещё раз».
function makeDeck(){ const order = shuffle(items.map((_, i) => i)), kinds = shuffle(order.map((_, i) => i % 2 ? "write" : "say")); return order.map((i, n) => [i, kinds[n]]); }
const validDeck = d => Array.isArray(d) && d.length === items.length && d.every(e => Array.isArray(e) && items[e[0]] && (e[1] === "say" || e[1] === "write"));
let deck, idx;
if (ONE) { deck = [[0, "say"]]; idx = 0; }
else { if (!validDeck(store.decks[setId])) { store.decks[setId] = makeDeck(); store.pos[setId] = 0; } deck = store.decks[setId]; idx = Math.min(store.pos[setId] || 0, deck.length - 1); }
save();
let hintLevel = 0, voiceOff = false;
const entry = () => deck[idx];
const cur = () => items[entry()[0]];
const kind = () => voiceOff ? "write" : entry()[1];
const variants = it => it.t === "q" ? it.ok : it.it;
const sample = it => it.t === "q" ? it.sample : (it.s || it.it[0]);
const id = () => `${setId}:${entry()[0]}`;
const passed = () => ONE ? 0 : deck.filter(e => store.ok[`${setId}:${e[0]}`]).length;

// ---- озвучка: записи Elsa (audio/parlare.mp3, карта {фраза: [старт мс, длительность мс]}); голос системы только если клипа нет
let player = null, stopAt = 0, stopTimer = 0, mediaUrl = null;
function mediaSrc(){ if (mediaUrl) return mediaUrl; const url = "audio/parlare.mp3"; if (typeof fetch !== "function" || typeof URL === "undefined" || !URL.createObjectURL) return mediaUrl = Promise.resolve(url); return mediaUrl = fetch(url).then(r => { if (!r.ok) throw new Error(String(r.status)); return r.blob(); }).then(b => URL.createObjectURL(b)).catch(() => url); }
function getPlayer(){ if (!player) { player = new Audio(); player.preload = "auto"; player.addEventListener("timeupdate", () => { if (stopAt && player.currentTime * 1000 >= stopAt) stopClip(); }); } return player; }
function stopClip(){ clearTimeout(stopTimer); stopAt = 0; if (player && !player.paused) player.pause(); }
function clip(seg){
  const p = getPlayer(); stopClip();
  const go = () => { stopAt = seg[0] + seg[1]; p.currentTime = seg[0] / 1000; const pr = p.play(); (pr && pr.then ? pr : Promise.resolve()).then(() => { stopTimer = setTimeout(stopClip, seg[1] + 80); }).catch(() => { stopAt = 0; }); };
  if (!p.dataset.ready) { p.dataset.ready = "1"; mediaSrc().then(src => { p.src = src; p.addEventListener("loadedmetadata", go, { once:true }); p.load(); }); } else go();
}
const clipOf = t => AUDIO_MAP[String(t).toLowerCase().replace(/[’‘]/g, "'")];
let itVoice = null;
function pickVoice(){ try { itVoice = speechSynthesis.getVoices().find(v => /^it([-_]|$)/i.test(v.lang)) || null; } catch (e) {} }
function speak(t){ const seg = clipOf(t); if (seg) { if ("speechSynthesis" in window) try { speechSynthesis.cancel(); } catch (e) {} clip(seg); return; } if (!("speechSynthesis" in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "it-IT"; if (itVoice) u.voice = itVoice; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// ---- распознавание (как в тренажёре)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, listening = false;
const micBtn = $("#mic"), micLabel = $("#micLabel"), interim = $("#interim"), result = $("#result"), notice = $("#notice");
function note(html, bad){ notice.innerHTML = html; notice.classList.toggle("bad", !!bad); notice.hidden = false; }
const badBrowser = () => /OPR\//.test(navigator.userAgent) || !!navigator.brave;
const PHONE = /Android/i.test(navigator.userAgent);
// Браузеры на движке Chrome без доступа к службе распознавания называют себя только Chromium (проверено на Dia). Кнопку не отключаем: признак косвенный.
const noService = () => { const d = navigator.userAgentData; if (!d || !d.brands || d.mobile) return false; const b = d.brands.map(x => x.brand); return b.includes("Chromium") && !b.includes("Google Chrome") && !b.includes("Microsoft Edge"); };
const micDenied = () => PHONE ? t("micPhone", location.hostname) : t("micDesk");
const netProblem = () => navigator.onLine === false ? t("netOff") : t("netFail");
const micState = async () => { try { return (await navigator.permissions.query({ name:"microphone" })).state; } catch (e) { return ""; } };
async function micProblem(){
  if (!PHONE) { note(micDenied(), true); return; }
  const before = await micState();
  if (before === "denied") { note(micDenied(), true); return; }
  let mic = false;
  try { const s = await navigator.mediaDevices.getUserMedia({ audio:true }); s.getTracks().forEach(t => t.stop()); mic = true; } catch (e) {}
  if ((await micState()) === "denied") note(micDenied(), true);
  else if (!mic) note(t("micApp"), true);
  else if (before === "prompt") note(t("micOk"));
  else note(t("micService"), true);
}
if (!SR) { note(t("noSR") + " " + t("writeOnly"), true); voiceOff = true; }
else if (badBrowser()) { note(t("noService") + " " + t("writeOnly"), true); voiceOff = true; }
else if (noService()) note(t("noService"), true);
else if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({ name:"microphone" }).then(p => { if (p.state === "denied") note(micDenied(), true); }).catch(() => {});
// Safari сам не заканчивает запись и может не прислать итог: попытку завершают пауза, кнопка или страховочные таймеры.
const SILENCE_MS = 2500, NO_SOUND_MS = 10000, STOP_WAIT_MS = 1200, MAX_MS = 20000;
const VERSION = "30.10-9", DEBUG = params.has("debug");
const verEl = document.createElement("p"); verEl.className = "ver"; verEl.textContent = t("version") + " " + VERSION; document.body.appendChild(verEl);
const who = () => { const d = navigator.userAgentData, b = d && d.brands ? d.brands.map(x => x.brand).filter(x => !x.includes("Not")).join(", ") : ""; return (b ? b + " · " : "") + navigator.userAgent.replace("Mozilla/5.0 ", "").slice(0, 120); };
let traceEl = null;
function traceShow(lines){ if (!traceEl) { traceEl = document.createElement("pre"); traceEl.className = "trace"; interim.after(traceEl); } traceEl.textContent = "версия " + VERSION + "\n" + who() + "\n" + lines.join("\n"); }
let finishRec = null, cancelRec = null;
const once = t => { const w = String(t).trim().split(" ").filter(Boolean), n = w.length, low = x => x.toLowerCase(); for (let p = 2; p <= n / 2; p++) if (n % p === 0 && w.every((x, i) => low(x) === low(w[i % p]))) return w.slice(0, p).join(" "); return t; };
function setListening(on){ listening = on; micBtn.classList.toggle("listening", on); micLabel.textContent = t(on ? "listening" : "mic"); }
function abortRec(){ if (cancelRec) cancelRec(); if (rec) { try { rec.onend = null; rec.abort(); } catch (e) {} rec = null; } setListening(false); interim.textContent = ""; }
function listen(){
  if (!SR) return;
  if (rec) { if (finishRec) finishRec(); return; }
  stopClip(); if ("speechSynthesis" in window) try { speechSynthesis.cancel(); } catch (e) {}
  result.hidden = true; interim.textContent = "";
  const r = new SR(); rec = r; r.lang = "it-IT"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let finals = null, lastInterim = "", failed = false, gotStart = false, settled = false, finishing = false, lastHeard = "", quietT = 0, stopT = 0, capT = 0; const t0 = Date.now();
  const trail = [], T = ev => { if (!DEBUG) return; trail.push(((Date.now() - t0) / 1000).toFixed(1) + " " + ev); traceShow(trail.length > 14 ? trail.slice(0, 4).concat("…", trail.slice(-9)) : trail); };
  const clearTimers = () => { clearTimeout(quietT); clearTimeout(stopT); clearTimeout(capT); };
  const settle = () => {
    if (settled) return; settled = true; clearTimers(); if (rec === r) rec = null; setListening(false); interim.textContent = "";
    if (finals) grade(finals.map(once), true);
    else if (failed) return;
    else if (lastInterim) grade([once(lastInterim)], true);
    else if (!gotStart && Date.now() - t0 < 1500) { note(t("noService") + " " + t("writeOnly"), true); voiceOff = true; render(); }
    else show({ st:"empty" });
  };
  const finish = () => { if (settled || finishing) return; finishing = true; T("stop"); clearTimers(); try { r.stop(); } catch (e) {} stopT = setTimeout(() => { T("нет ответа на stop"); try { r.abort(); } catch (e) {} settle(); }, STOP_WAIT_MS); };
  finishRec = () => { if (lastInterim) finish(); else abortRec(); };
  cancelRec = () => { settled = true; clearTimers(); };
  quietT = setTimeout(finish, NO_SOUND_MS); capT = setTimeout(finish, MAX_MS);
  if (DEBUG) for (const n of ["audiostart", "soundstart", "speechstart", "speechend", "soundend", "audioend"]) r.addEventListener && r.addEventListener(n, () => T(n));
  r.onstart = () => { T("start"); gotStart = true; notice.hidden = true; setListening(true); }; r.onaudiostart = () => { gotStart = true; };
  r.onresult = e => {
    if (settled) return;
    for (let i = e.resultIndex || 0; i < e.results.length; i++) {
      const res = e.results[i], alts = []; for (let k = 0; k < res.length; k++) alts.push(res[k].transcript);
      if (res.isFinal) finals = (finals || []).concat(alts); else lastInterim = alts[0] || lastInterim;
    }
    const heard = once(lastInterim); interim.textContent = finals ? "" : heard;
    T((finals ? "итог: " + finals[0] : "текст: " + lastInterim).slice(0, 70));
    if (finals) { settle(); try { r.stop(); } catch (e) {} } else if (!finishing && heard !== lastHeard) { lastHeard = heard; clearTimeout(quietT); quietT = setTimeout(finish, SILENCE_MS); }
  };
  r.onerror = e => {
    if (settled) return; const code = e && e.error; T("ошибка: " + code);
    if (lastInterim && code !== "not-allowed" && code !== "service-not-allowed") { settle(); return; }
    failed = true;
    if (code === "not-allowed" || code === "service-not-allowed") micProblem();
    else if (code === "audio-capture") note(t("micNone"), true);
    else if (code === "network") { if (navigator.onLine === false) note(netProblem(), true); else { note(netProblem() + " " + t("writeOnly"), true); voiceOff = true; } }
    else if (code !== "aborted") show({ st:"empty" }, code);
    settle();
    if (voiceOff) render();
  };
  r.onend = () => { T("end"); settle(); };
  try { r.start(); } catch (e) { cancelRec(); rec = null; setListening(false); show({ st:"empty" }); }
}
// лучший результат среди альтернатив распознавания
function grade(answers, spoken){
  const it = cur(), vs = variants(it);
  const rank = { ok:3, near:2, bad:1, empty:0 };
  let best = { st:"empty" }, heard = answers[0] || "";
  const bare = s => s.replace(/^(il|lo|la|i|gli|le|un|uno|una) /i, "").replace(/^(l|un)['’]/i, "");
  for (const a of answers) { const r = judge(ONE && ONE.w ? bare(a) : a, vs, spoken); if (rank[r.st] > rank[best.st]) { best = r; heard = a; } }
  store.tries[id()] = (store.tries[id()] || 0) + 1; if (best.st === "ok") store.ok[id()] = true; save();
  show(best, "", heard, spoken); paintProgress();
}
function show(r, code, heard, spoken){
  result.hidden = false; result.className = "result " + (r.st === "empty" ? "" : r.st); $("#again").hidden = r.st === "ok";
  const it = cur(), isQ = it.t === "q", vs = variants(it), h = heard != null ? `«${esc(heard)}»` : "", model = isQ ? it.sample : r.v;
  if (r.st === "empty") { result.innerHTML = `<b>${t(spoken === false ? "emptyW" : "emptyS")}</b> ${t(spoken === false ? "emptyWTip" : "emptySTip")}`; return; }
  if (ONE) $("#oneDone").hidden = r.st !== "ok";
  $("#play").hidden = false;                     // образец слышно только после попытки: иначе это третья подсказка
  if (r.st === "ok") { result.innerHTML = `<b>${t("right")}</b>${heard && norm(heard) !== norm(r.v) ? ` · ${t(spoken ? "heardSay" : "heardWrite")} ${h}` : ""}${isQ ? ` <span class="alts">${t("example")} ${esc(it.sample)}</span>` : ""}`; return; }
  const said = t(spoken ? "Heard" : "Answer"), shown = isQ ? esc(model) : diffHtml(model.replace(/\*/g, "…"), heard || "");
  if (r.st === "near") { result.innerHTML = `<b>${t("near")}</b> ${said} ${h}. ${t(r.note === "accent" ? "whyAccent" : isQ ? "whyWordQ" : "whyWord")} ${t("sample")} <span class="diff">${shown}</span>`; return; }
  result.innerHTML = `<b>✗ ${said} ${h || t("other")}.</b> ${t("sample")} <span class="diff">${shown}</span>${!isQ && vs.length > 1 && !/\*/.test(vs[1]) ? `<span class="alts">${t("also")} ${esc(vs[1])}</span>` : ""}`;
}

// ---- экран
function paintProgress(){
  if (ONE) return;
  $("#pos").textContent = t("pos", idx + 1, deck.length); $("#done").textContent = t("done", passed(), deck.length);
}
function paintHint(){ const b = $("#hint"); b.textContent = t(hintLevel >= 2 ? "hintEnd" : hintLevel === 1 ? "hint2" : "hint1"); b.disabled = hintLevel >= 2; }
function render(){
  abortRec(); const it = cur(), isQ = it.t === "q", say = kind() === "say";
  hintLevel = 0; result.hidden = true; $("#again").hidden = true;
  $("#task").textContent = t(isQ ? (say ? "taskQaSay" : "taskQaWrite") : (say ? "taskSay" : "taskWrite"));
  const p = $("#prompt"); p.classList.toggle("it", isQ); p.textContent = isQ ? it.q : (it[lang] || it.ru);
  const hl = $("#hintline"); hl.classList.toggle("tr", isQ); hl.textContent = isQ ? (it[lang] || it.ru) : "";
  $("#write").hidden = say; $("#keys").hidden = say; $("#mic").hidden = !say; $("#hint").hidden = isQ; paintHint();
  $("#answer").value = ""; $("#play").hidden = !isQ; $("#playLabel").textContent = t(isQ ? "playQuestion" : "playAnswer");
  $("#next").textContent = t(idx === deck.length - 1 ? "last" : "next"); $("#prev").disabled = idx === 0;
  if (ONE) { $("#progress").hidden = true; $("#setName").hidden = true; $("#nav").hidden = true; }
  else { $("#setName").textContent = SETS[setId].name; store.pos[setId] = idx; save(); }
  paintProgress();
  if (!say) setTimeout(() => $("#answer").focus({ preventScroll:true }), 0);
}
function showFinish(){
  abortRec(); $("#card").hidden = true; $("#finish").hidden = false;
  $("#finishScore").textContent = t("finishScore", passed(), deck.length);
}
function restart(){
  store.decks[setId] = deck = makeDeck(); deck.forEach(e => { delete store.ok[`${setId}:${e[0]}`]; }); idx = 0; store.pos[setId] = 0; save();
  $("#finish").hidden = true; $("#card").hidden = false; render();
}
// статические подписи
document.title = t("title"); $("#title").textContent = t("title"); $("#sub").textContent = t("sub"); $("#back").textContent = t("back"); $("#how").textContent = t("how"); $("#voice").textContent = t("voice");
$("#answer").placeholder = t("placeholder"); $("#check").textContent = t("check"); $("#prev").textContent = t("prev"); $("#again").textContent = t("again"); micLabel.textContent = t("mic");
$("#finishTitle").textContent = t("finishTitle"); $("#restart").textContent = t("restart");
if (ONE) { const d = document.createElement("p"); d.id = "oneDone"; d.className = "task"; d.hidden = true; d.textContent = t("oneDone"); $("#card").appendChild(d); }

$("#next").addEventListener("click", () => { if (idx >= deck.length - 1) { showFinish(); return; } idx++; render(); });
$("#prev").addEventListener("click", () => { if (idx > 0) { idx--; render(); } });
$("#hint").addEventListener("click", () => { if (hintLevel >= 2) return; hintLevel++; $("#hintline").innerHTML = skeleton(cur().it[0], hintLevel); paintHint(); });
$("#play").addEventListener("click", () => { abortRec(); stopClip(); const it = cur(); speak(it.t === "q" ? it.q : sample(it)); });
micBtn.addEventListener("click", listen);
$("#again").addEventListener("click", () => { if (kind() === "write") { $("#answer").value = ""; result.hidden = true; $("#again").hidden = true; $("#answer").focus(); } else listen(); });
$("#restart").addEventListener("click", restart);
const checkWritten = () => { const v = $("#answer").value; if (!v.trim()) { show({ st:"empty" }, "", "", false); return; } const r = judge(v, variants(cur()), false); store.tries[id()] = (store.tries[id()] || 0) + 1; if (r.st === "ok") store.ok[id()] = true; save(); show(r, "", v, false); paintProgress(); };
$("#check").addEventListener("click", checkWritten);
$("#answer").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkWritten(); } });
$("#keys").addEventListener("pointerdown", e => e.preventDefault());
$("#keys").addEventListener("click", e => { const b = e.target.closest("button[data-ch]"); if (!b) return; const a = $("#answer"), s = a.selectionStart ?? a.value.length, u = a.selectionEnd ?? s; a.value = a.value.slice(0, s) + b.dataset.ch + a.value.slice(u); a.selectionStart = a.selectionEnd = s + 1; a.focus(); });
window.addEventListener("hashchange", () => location.reload());
render();
</script>
